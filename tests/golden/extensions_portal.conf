; ---- Click to call: only started by the dashboard, never dialled ----
[portal-c2c-ring]
exten => _2XXX.,1,Set(CALLERID(name)=Calling ${EXTEN:3})
 same => n,Set(CALLERID(num)=${EXTEN:3})
 same => n,Dial(PJSIP/${EXTEN:0:3},30)
 same => n,Hangup()
[portal-c2c-dial]
exten => _2XXX.,1,Set(C2C=${EXTEN:0:3})
 same => n,Set(CDR(userfield)=c2c:${C2C})
 same => n,Set(__RECEXT=${C2C})
 same => n,Set(__RECTENANT=1001)
 same => n,Set(EXT_CID=${EXTCID_${C2C}})
 same => n,Goto(from-internal,${EXTEN:3},1)

; ---- Click to call: only started by the dashboard, never dialled ----
[t1002-c2c-ring]
exten => _2XXX.,1,Set(CALLERID(name)=Calling ${EXTEN:3})
 same => n,Set(CALLERID(num)=${EXTEN:3})
 same => n,Dial(PJSIP/1002${EXTEN:0:3},30)
 same => n,Hangup()
[t1002-c2c-dial]
exten => _2XXX.,1,Set(C2C=${EXTEN:0:3})
 same => n,Set(CDR(userfield)=c2c:${C2C})
 same => n,Set(CHANNEL(accountcode)=1002)
 same => n,Set(__RECEXT=${C2C})
 same => n,Set(__RECTENANT=1002)
 same => n,Set(EXT_CID=${EXTCID_1002${C2C}})
 same => n,Goto(t1002-internal,${EXTEN:3},1)

; ---- Call links: what browsers (endpoint webguest) can reach, nothing else ----
[portal-weblinks]
exten => wl-test-link-1,1,NoOp(Call link 1: Website)
 same => n,Set(GROUP(weblink)=link1)
 same => n,GotoIf($[${GROUP_COUNT(link1@weblink)} > 2]?busy)
 same => n,Set(GROUP(webtenant)=1001)
 same => n,GotoIf($[${GROUP_COUNT(1001@webtenant)} > 10]?busy)
 same => n,Set(GROUP(webguests)=all)
 same => n,GotoIf($[${GROUP_COUNT(all@webguests)} > 30]?busy)
 same => n,Set(TIMEOUT(absolute)=1800)
 same => n,Set(WNAME=${FILTER(A-Za-z0-9 ._,${PJSIP_HEADER(read,X-Web-Name)})})
 same => n,Set(CALLERID(name)=${IF($["${WNAME}" = ""]?Web visitor:${WNAME:0:24})} (Website))
 same => n,Set(CALLERID(num)=web)
 same => n,Playback(<DATA>/gen/ivr/t1001/recording-notice)  ; calls may be recorded
 same => n,Goto(portal-ivr-500,s,1)
 same => n(busy),Congestion(5)
 same => n,Hangup()
exten => wl-test-link-2,1,NoOp(Call link 2: Video sales)
 same => n,Set(GROUP(weblink)=link2)
 same => n,GotoIf($[${GROUP_COUNT(link2@weblink)} > 2]?busy)
 same => n,Set(GROUP(webtenant)=1001)
 same => n,GotoIf($[${GROUP_COUNT(1001@webtenant)} > 10]?busy)
 same => n,Set(GROUP(webguests)=all)
 same => n,GotoIf($[${GROUP_COUNT(all@webguests)} > 30]?busy)
 same => n,Set(TIMEOUT(absolute)=1800)
 same => n,Set(WNAME=${FILTER(A-Za-z0-9 ._,${PJSIP_HEADER(read,X-Web-Name)})})
 same => n,Set(CALLERID(name)=${IF($["${WNAME}" = ""]?Web visitor:${WNAME:0:24})} (Video sales))
 same => n,Set(CALLERID(num)=web)
 same => n,Playback(<DATA>/gen/ivr/t1001/recording-notice)  ; calls may be recorded
 same => n,Goto(portal-ringgroups,600,1)
 same => n(busy),Congestion(5)
 same => n,Hangup()

; ---- Call recording: which answered calls are recorded ----
[portal-rec]
exten => s,1,Set(CALLEE=${PBX_EXT})  ; empty unless an extension answered
 same => n,Set(RT=${IF($["${CALLEE}" != ""]?${PBX_TENANT}:${RECTENANT})})  ; the call's tenant
 same => n,GotoIf($["${RT}" = ""]?done)
 same => n,Set(RPRE=${LOGINPRE_${RT}})
 same => n,GotoIf($["${CALLEE}" != ""]?toext)
 same => n,GotoIf($["${RECEXT}" = "" | "${REC_${RPRE}${RECEXT}}" = ""]?done)
 same => n,Set(RX=${RECEXT})
 same => n,Set(RO=${RECTO})
 same => n,Set(RD=out)
 same => n,ExecIf($["${RECNOTICE_${RT}}" != ""]?Playback(${RECNOTICE_${RT}}))  ; told before they're connected
 same => n,Goto(rec)
 same => n(toext),GotoIf($["${REC_${RPRE}${CALLEE}}${REC_${RPRE}${RECEXT}}" = ""]?done)
 same => n,Set(RX=${CALLEE})
 same => n,Set(RO=${CALLERID(num)})
 same => n,ExecIf($["${REC_${RPRE}${CALLEE}}" = ""]?Set(RX=${RECEXT}))
 same => n,ExecIf($["${REC_${RPRE}${CALLEE}}" = ""]?Set(RO=${CALLEE}))
 same => n,Set(RD=${IF($["${RECEXT}" = ""]?in:int)})
 same => n(rec),Set(RO=${FILTER(0-9,${RO})})
 same => n,ExecIf($["${RO}" = ""]?Set(RO=unknown))
 same => n,MixMonitor(${RECDIR_${RT}}/${STRFTIME(${EPOCH},Europe/Dublin,%Y%m%d-%H%M%S)}_${RX}_${RO:0:20}_${RD}_${UNIQUEID}.ulaw,b)
 same => n(done),Return()

; ---- Ring groups (included into from-internal) ----
[portal-ringgroups]
exten => 600,1,NoOp(Ring group 600: Everyone)
 same => n,ExecIf($["${RECEXT}" = "" & "${PBX_EXT}" != ""]?Set(__RECEXT=${PBX_EXT}))
 same => n,ExecIf($["${RECTENANT}" = "" & "${PBX_TENANT}" != ""]?Set(__RECTENANT=${PBX_TENANT}))
 same => n,Set(RG=)
 same => n,ExecIf($["${DB(DND/201)}" != "1"]?Set(RG=${RG}&PJSIP/201))
 same => n,ExecIf($["${DB(DND/202)}" != "1"]?Set(RG=${RG}&PJSIP/202))
 same => n,ExecIf($["${DB(DND/203)}" != "1"]?Set(RG=${RG}&PJSIP/203))
 same => n,GotoIf($["${RG}" = ""]?nobody)
 same => n,Dial(${RG:1},25,U(portal-rec))
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Hangup())
 same => n(nobody),NoOp()
 same => n,VoiceMail(201@portal,u)
 same => n,Hangup()
exten => 601,1,NoOp(Ring group 601: Hunt)
 same => n,ExecIf($["${RECEXT}" = "" & "${PBX_EXT}" != ""]?Set(__RECEXT=${PBX_EXT}))
 same => n,ExecIf($["${RECTENANT}" = "" & "${PBX_TENANT}" != ""]?Set(__RECTENANT=${PBX_TENANT}))
 same => n,GotoIf($["${DB(DND/202)}" = "1"]?skip0)
 same => n,Dial(PJSIP/202,25,U(portal-rec))
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Hangup())
 same => n(skip0),NoOp()
 same => n,GotoIf($["${DB(DND/203)}" = "1"]?skip1)
 same => n,Dial(PJSIP/203,25,U(portal-rec))
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Hangup())
 same => n(skip1),NoOp()
 same => n,Hangup()
exten => 500,1,Goto(portal-ivr-500,s,1)
exten => 400,1,Goto(portal-hours-400,s,1)

[portal-ivr-500]
exten => s,1,NoOp(IVR menu 500: Main)
 same => n,Set(MENUHOPS=$[0${MENUHOPS} + 1])
 same => n,GotoIf($[${MENUHOPS} > 20]?bye)
 same => n,ExecIf($["${CHANNEL(state)}" != "Up"]?Answer())
 same => n,ExecIf($[${MENUHOPS} = 1]?Wait(1))  ; so the greeting's start isn't cut off
 same => n,Set(TRIES=0)
 same => n,Set(TIMEOUT(digit)=3)
 same => n(menu),Set(TRIES=$[${TRIES} + 1])
 same => n,Background(<DATA>/gen/ivr/t1001/ivr-500)
 same => n,WaitExten(6)
 same => n(bye),Hangup()
exten => 0,1,Hangup()
exten => 1,1,Goto(portal-ringgroups,600,1)
 same => n,Hangup()
exten => 2,1,VoiceMail(202@portal,u)
 same => n,Hangup()
