; Generated by the admin dashboard (Phone System tab).
; Do not edit by hand: changes here are overwritten on the next save.
; Included from extensions.conf.

[globals]
OUTBOUND_CID=015550000
MAX_OUTBOUND=6
VOXBEAM_PREFIX=0011101
LCR_TOKEN=lcr-test-token
EXTCID_202=0871234567
REC_201=1
RECDIR_1001=<DATA>/rec/t1001
RECNOTICE_1001=<DATA>/gen/ivr/t1001/recording-notice
MAXCALLS_1002=3
OUTBOUND_CID_1002=015559999
LOGINPRE_1002=1002
RECDIR_1002=<DATA>/rec/t1002

