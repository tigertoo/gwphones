; /etc/asterisk/extensions.conf
; Static dialplan. The parts you change day to day (caller ID, Voxbeam
; route, trunk order, ring groups, inbound routing) are generated by the
; admin dashboard's Phone System tab into extensions_portal.conf, which is
; included here. Edit this file only for things the portal doesn't cover.

[general]
; A reload clears every global first, so one the dashboard stops writing
; (REC_201 after "Record every call" is unticked, an EXTCID_ that's been
; cleared) goes too. Asterisk decides this with the value from the
; previous load: after adding it, reload twice.
clearglobalvars=yes
static=yes
writeprotect=yes

; [globals], [portal-internal], [portal-outbound], [portal-hints],
; [portal-features], [portal-call-ext], [portal-ringgroups],
; [sub-outbound], [portal-inbound] and every other tenant's sections
#include portal/extensions_portal.conf

; ---------------------------------------------------------------
; Calls placed by your phones (the main tenant's: their endpoint-ext
; template sets context=from-internal). Everything they can dial is
; generated into [portal-internal] in extensions_portal.conf: extensions,
; voicemail (*97/*98), 112/999, feature codes, ring groups, menus,
; schedules and outside numbers ([portal-outbound]). Other tenants'
; phones start in their own [t<code>-internal] instead.
; ---------------------------------------------------------------
[from-internal]
include => portal-internal

; ---------------------------------------------------------------
; Calls arriving from the trunks
; The dialled number is normalised to 353... (same rule the portal uses
; when you enter an inbound number), then routed by [portal-inbound].
; ---------------------------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(Inbound call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(DID=${EXTEN})
 same => n,ExecIf($["${DID:0:2}" = "00"]?Set(DID=${DID:2}))
 same => n,ExecIf($["${DID:0:1}" = "0"]?Set(DID=353${DID:1}))
 same => n,Goto(portal-inbound,${DID},1)
exten => _+X.,1,Goto(from-trunk,${EXTEN:1},1)
exten => s,1,Goto(portal-inbound,s,1)
