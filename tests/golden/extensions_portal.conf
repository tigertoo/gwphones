; ---- Calls for an extension: do not disturb, forwarding, voicemail ----
[portal-call-ext]
exten => _2XX,1,Set(HOPS=$[0${HOPS} + 1])
 same => n,GotoIf($[${HOPS} > 3]?vm-u)  ; forwarded round in a loop
 same => n,Set(FWD=${DB(CF/${EXTEN})})
 same => n,GotoIf($["${FWD}" != ""]?fwd)
 same => n,GotoIf($["${DB(DND/${EXTEN})}" = "1"]?busy)
 same => n,ExecIf($["${RECEXT}" = "" & "${PBX_EXT}" != ""]?Set(__RECEXT=${PBX_EXT}))
 same => n,ExecIf($["${RECTENANT}" = "" & "${PBX_TENANT}" != ""]?Set(__RECTENANT=${PBX_TENANT}))
 same => n,Dial(PJSIP/${EXTEN},30,U(portal-rec))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Set(FWD=${DB(CFU/${EXTEN})})
 same => n,GotoIf($["${FWD}" != ""]?fwd)
 same => n(vm-u),VoiceMail(${EXTEN}@portal,u)
 same => n,Hangup()
 same => n(busy),Set(FWD=${DB(CFB/${EXTEN})})
 same => n,GotoIf($["${FWD}" != ""]?fwd)
 same => n,VoiceMail(${EXTEN}@portal,b)
 same => n,Hangup()
 same => n(fwd),GotoIf($["${FWD}" = "${EXTEN}"]?vm-u)
 same => n,GotoIf($[${REGEX("^(2[0-9][0-9]|0[1-9][0-9]{7}[0-9]?)$" ${FWD})}]?:vm-u)  ; set by hand to somewhere not allowed
 same => n,ExecIf($["${CDR(userfield)}" = ""]?Set(CDR(userfield)=fwd:${EXTEN}))
 same => n,Set(EXT_CID=${EXTCID_${EXTEN}})
 same => n,Goto(from-internal,${FWD},1)
 same => n(done),Hangup()

