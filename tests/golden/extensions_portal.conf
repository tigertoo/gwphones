; ---- Feature codes (included into from-internal) ----
; *78/*79 do not disturb on/off; *72<number>/*73 forward always;
; *90<number>/*91 forward when busy; *52<number>/*53 forward when
; unanswered; *8 answer any ringing extension; **2XX answer that one;
; 700 park (transfer a call to it), 701-720 pick a parked call up.
[portal-features]
include => parkedcalls
exten => *78,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,Set(DB(DND/${ME})=1)
 same => n,Playback(do-not-disturb&activated)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => *79,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,NoOp(${DB_DELETE(DND/${ME})})
 same => n,Playback(do-not-disturb&de-activated)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => _*72X.,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,Set(T=${EXTEN:3})
 same => n,GotoIf($[${REGEX("^(2[0-9][0-9]|0[1-9][0-9]{7}[0-9]?)$" ${T})}]?:bad)
 same => n,GotoIf($["${T}" = "${ME}"]?bad)
 same => n,Set(DB(CF/${ME})=${T})
 same => n,Playback(call-fwd-unconditional&activated)
 same => n,SayDigits(${T})
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => *73,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,NoOp(${DB_DELETE(CF/${ME})})
 same => n,Playback(call-fwd-unconditional&de-activated)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => _*90X.,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,Set(T=${EXTEN:3})
 same => n,GotoIf($[${REGEX("^(2[0-9][0-9]|0[1-9][0-9]{7}[0-9]?)$" ${T})}]?:bad)
 same => n,GotoIf($["${T}" = "${ME}"]?bad)
 same => n,Set(DB(CFB/${ME})=${T})
 same => n,Playback(call-fwd-on-busy&activated)
 same => n,SayDigits(${T})
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => *91,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,NoOp(${DB_DELETE(CFB/${ME})})
 same => n,Playback(call-fwd-on-busy&de-activated)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => _*52X.,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,Set(T=${EXTEN:3})
 same => n,GotoIf($[${REGEX("^(2[0-9][0-9]|0[1-9][0-9]{7}[0-9]?)$" ${T})}]?:bad)
 same => n,GotoIf($["${T}" = "${ME}"]?bad)
 same => n,Set(DB(CFU/${ME})=${T})
 same => n,Playback(call-fwd-no-ans&activated)
 same => n,SayDigits(${T})
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => *53,1,Answer()
 same => n,Set(ME=${PBX_EXT})
 same => n,GotoIf($[${REGEX("^2[0-9][0-9]$" ${ME})}]?:bad)
 same => n,NoOp(${DB_DELETE(CFU/${ME})})
 same => n,Playback(call-fwd-no-ans&de-activated)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()
exten => *8,1,Pickup()
 same => n,Hangup()
exten => _**2XX,1,PickupChan(PJSIP/${EXTEN:2}-,p)
 same => n,Hangup()

