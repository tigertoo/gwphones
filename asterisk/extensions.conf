; /etc/asterisk/extensions.conf
; Static dialplan. The parts you change day to day (caller ID, Voxbeam
; route, trunk order, ring groups, inbound routing) are generated by the
; admin dashboard's Phone System tab into extensions_portal.conf, which is
; included here. Edit this file only for things the portal doesn't cover.

[general]
static=yes
writeprotect=yes

; [globals], [portal-ringgroups], [sub-outbound], [portal-inbound]
#include portal/extensions_portal.conf

; ---------------------------------------------------------------
; Calls placed by your phones
; ---------------------------------------------------------------
[from-internal]
include => portal-ringgroups

; Extension to extension (200-299). Unanswered, busy or offline: that
; extension's voicemail (mailboxes are generated into
; portal/voicemail_portal.conf, voicemail context "portal").
exten => _2XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,VoiceMail(${EXTEN}@portal,${IF($["${DIALSTATUS}" = "BUSY"]?b:u)})
 same => n(done),Hangup()

; Voicemail: *97 your own mailbox (asks for the PIN), *98 any mailbox
exten => *97,1,VoiceMailMain(${CALLERID(num)}@portal)
 same => n,Hangup()
exten => *98,1,VoiceMailMain(@portal)
 same => n,Hangup()

; Emergency: always straight out via Irish VoIP, whatever the portal's
; trunk settings say, and never subject to the outbound call limit.
exten => 112,1,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(PJSIP/112@irishvoip,120)
 same => n,Hangup()
exten => 999,1,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(PJSIP/999@irishvoip,120)
 same => n,Hangup()

; Outbound numbers are sorted by kind; the Phone System tab decides which
; trunk(s) each kind uses ([sub-outbound] in extensions_portal.conf).
; ARG1 = national format, ARG2 = international without 00.

; Irish mobiles: 083, 085, 086, 087, 089 + 7 digits
exten => _08[35679]XXXXXXX,1,Gosub(sub-outbound,mobile,1(${EXTEN},353${EXTEN:1}))

; Other Irish numbers: 0 + 8 or 9 digits (01 234 5678, 021 123 4567, 0818...)
exten => _0[1-9]XXXXXXX,1,Gosub(sub-outbound,landline,1(${EXTEN},353${EXTEN:1}))
exten => _0[1-9]XXXXXXXX,1,Gosub(sub-outbound,landline,1(${EXTEN},353${EXTEN:1}))

; Irish freephone 1800
exten => _1800XXXXXX,1,Gosub(sub-outbound,freephone,1(${EXTEN},353${EXTEN}))

; Irish numbers dialled in international form go the same way as above
exten => _00353X.,1,Goto(0${EXTEN:5},1)
exten => _+353X.,1,Goto(0${EXTEN:4},1)
exten => _003531800XXXXXX,1,Goto(1800${EXTEN:9},1)
exten => _+3531800XXXXXX,1,Goto(1800${EXTEN:8},1)
; +353 (0)87... as phones often store it: drop the extra 0
exten => _003530X.,1,Goto(0${EXTEN:6},1)
exten => _+3530X.,1,Goto(0${EXTEN:5},1)

; International (outside Ireland): 00 or + then at least 7 digits
exten => _00[1-9]XXXXXX.,1,Gosub(sub-outbound,international,1(${EXTEN},${EXTEN:2}))
exten => _+[1-9]XXXXXX.,1,Gosub(sub-outbound,international,1(00${EXTEN:1},${EXTEN:1}))

; Everything else (premium 15xx, short codes, etc.) matches nothing above
; and is refused. Add patterns here deliberately if needed.

; ---------------------------------------------------------------
; Calls arriving from the trunks
; The dialled number is normalised to 353... (same rule the portal uses
; when you enter an inbound number), then routed by [portal-inbound].
; ---------------------------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(Inbound call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(DID=${EXTEN})
 same => n,ExecIf($["${DID:0:2}" = "00"]?Set(DID=${DID:2}))
 same => n,ExecIf($["${DID:0:1}" = "0"]?Set(DID=353${DID:1}))
 same => n,Goto(portal-inbound,${DID},1)
exten => _+X.,1,Goto(from-trunk,${EXTEN:1},1)
exten => s,1,Goto(portal-inbound,s,1)
